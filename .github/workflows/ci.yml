# M13：每次 push / PR 构建并跑全部单元测试；不调用真实模型（真实评测需手动触发，避免产生费用）。
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "是否运行真实模型评测（需配置 OPENAI_API_KEY secret，会产生费用）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test & build
        run: ./gradlew test installDist distZip --no-daemon
      - name: Smoke test CLI
        run: build/install/mcc/bin/mcc --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: build/reports/tests/
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: mcc-dist
          path: build/distributions/*.zip

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew installDist --no-daemon
      - name: Run evals (cost capped)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 evals/run_evals.py --repeat 3 --max-cost-usd 3 --label ci
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/
